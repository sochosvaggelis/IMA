name: Layout checks

# Geometry-based layout invariants (tests/layout.spec.ts) across all five
# test viewports. The pixel-comparison suite (tests/visual.spec.ts) does NOT
# run here: its baselines are rendered on Windows, and the same page
# rasterises differently on this runner's software GL — it is run locally
# instead, before pushing.
#
# ON DEMAND ONLY: Actions → Layout checks → Run workflow. It used to run on
# every push, alongside the deploy — never blocking it, but taking 10–13
# minutes each time (the 3D home page renders in software here, at five
# viewport sizes). Run the same suites locally with `npm test`.
on:
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-latest
    # A hung browser would otherwise hold the runner for GitHub's six-hour
    # default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Plus the admin panel and the database-backed pages, run against the
      # in-browser fake in tests/fakeSupabase.ts — behaviour, no baselines,
      # so they are as platform-independent as the layout checks.
      - run: npx playwright test tests/layout.spec.ts tests/admin.spec.ts tests/content.spec.ts
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
